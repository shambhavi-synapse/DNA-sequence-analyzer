<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-labelledby="title desc"><title id="title">Genomic span, pre-mRNA and mature RNA are different lengths</title><desc id="desc">A gene with three compact exons separated by long introns spans a large DNA interval. Transcription includes exons and introns in pre-mRNA, while splicing joins the exons into a shorter mature RNA.</desc><rect width="640" height="280" rx="16" fill="#f4f0e8"/><style>text{font-family:Manrope,Arial,sans-serif;fill:#2f3032}.title{font-size:20px;font-weight:700}.label{font-size:15px;font-weight:650}.small{font-size:13px;fill:#615a55}.rail{stroke:#756e69;stroke-width:3;fill:none;stroke-linecap:round}.arrow{stroke:#b64735;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.exon{fill:#e27556;stroke:#874335;stroke-width:1.5}</style><text x="32" y="38" class="title">A gene can span far more DNA than its mature RNA</text><text x="32" y="84" class="label">Genomic DNA</text><path class="rail" d="M154 78H606"/><rect class="exon" x="164" y="62" width="34" height="32" rx="4"/><rect class="exon" x="378" y="62" width="34" height="32" rx="4"/><rect class="exon" x="564" y="62" width="34" height="32" rx="4"/><text x="238" y="70" class="small">long intron</text><text x="450" y="70" class="small">long intron</text><path class="arrow" d="M330 105v24m-8-9 8 9 8-9"/><text x="32" y="159" class="label">pre-mRNA</text><path class="rail" d="M154 153H606"/><rect class="exon" x="164" y="137" width="34" height="32" rx="4"/><rect class="exon" x="378" y="137" width="34" height="32" rx="4"/><rect class="exon" x="564" y="137" width="34" height="32" rx="4"/><text x="216" y="181" class="small">introns are transcribed before processing</text><path class="arrow" d="M330 184v24m-8-9 8 9 8-9"/><text x="32" y="238" class="label">Mature RNA</text><path class="rail" d="M154 232H380"/><rect class="exon" x="174" y="216" width="62" height="32" rx="4"/><rect class="exon" x="236" y="216" width="62" height="32" rx="4"/><rect class="exon" x="298" y="216" width="62" height="32" rx="4"/><text x="405" y="237" class="small">introns removed</text><text x="32" y="268" class="small">Relative lengths are schematic and not to scale.</text></svg>
