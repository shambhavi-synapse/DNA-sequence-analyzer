<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-labelledby="title desc">
 <title id="title">Alternative splicing produces distinct mature RNA isoforms</title><desc id="desc">One pre-mRNA containing four exons is spliced into two mature transcripts. Isoform A includes exons one, two and four. Isoform B includes exons one, three and four.</desc>
 <rect width="640" height="280" rx="16" fill="#f4f0e8"/><style>text{font-family:Manrope,Arial,sans-serif;fill:#2f3032}.title{font-size:20px;font-weight:700}.label{font-size:15px;font-weight:650}.small{font-size:13px;fill:#615a55}.rail{stroke:#6f6a66;stroke-width:3;fill:none;stroke-linecap:round}.arrow{stroke:#b64735;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.exon{stroke:#6d4d42;stroke-width:1.5}.e1{fill:#e6c8ae}.e2{fill:#e27556}.e3{fill:#b64735}.e4{fill:#d6b89a}</style>
 <text x="32" y="38" class="title">One pre-mRNA, two mature transcripts</text><text x="32" y="82" class="label">pre-mRNA</text><path class="rail" d="M135 77H604"/>
 <g><rect class="exon" fill="#e6c8ae" x="155" y="60" width="64" height="34" rx="5"/><rect class="exon" fill="#e27556" x="286" y="60" width="64" height="34" rx="5"/><rect class="exon" fill="#b64735" x="417" y="60" width="64" height="34" rx="5"/><rect class="exon" fill="#d6b89a" x="540" y="60" width="64" height="34" rx="5"/><text x="178" y="82">E1</text><text x="309" y="82">E2</text><text x="440" y="82" style="fill:#fff">E3</text><text x="563" y="82">E4</text></g><path class="arrow" d="M364 105v25m-8-9 8 9 8-9"/>
 <text x="32" y="170" class="label">Isoform A</text><path class="rail" d="M135 165H410"/><rect class="exon" fill="#e6c8ae" x="155" y="148" width="80" height="34" rx="5"/><rect class="exon" fill="#e27556" x="235" y="148" width="80" height="34" rx="5"/><rect class="exon" fill="#d6b89a" x="315" y="148" width="80" height="34" rx="5"/><text x="184" y="170">E1</text><text x="264" y="170">E2</text><text x="344" y="170">E4</text><text x="440" y="170" class="small">E3 skipped</text>
 <text x="32" y="225" class="label">Isoform B</text><path class="rail" d="M135 220H410"/><rect class="exon" fill="#e6c8ae" x="155" y="203" width="80" height="34" rx="5"/><rect class="exon" fill="#b64735" x="235" y="203" width="80" height="34" rx="5"/><rect class="exon" fill="#d6b89a" x="315" y="203" width="80" height="34" rx="5"/><text x="184" y="225">E1</text><text x="264" y="225" style="fill:#fff">E3</text><text x="344" y="225">E4</text><text x="440" y="225" class="small">E2 skipped</text><text x="32" y="264" class="small">Exon choice changes the mature RNA without changing the underlying DNA.</text>
</svg>
