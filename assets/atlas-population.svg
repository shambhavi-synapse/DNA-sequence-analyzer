<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-labelledby="title desc"><title id="title">Population sampling affects which genomic variation is observed</title><desc id="desc">Three abstract population groups contribute unequal sample sizes to a reference dataset. A variant present in the smallest group is underrepresented in the combined panel, illustrating why sampling affects frequency estimates and interpretation.</desc><rect width="640" height="280" rx="16" fill="#f4f0e8"/><style>text{font-family:Manrope,Arial,sans-serif;fill:#2f3032}.title{font-size:20px;font-weight:700}.label{font-size:14px;font-weight:650}.small{font-size:13px;fill:#615a55}.person{fill:#d6b89a;stroke:#6d5c52;stroke-width:1.2}.minor{fill:#e27556}.arrow{stroke:#b64735;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.panel{fill:#fffaf5;stroke:#b9aaa0;stroke-width:1.5}</style><text x="32" y="38" class="title">Reference data reflect who was sampled</text><text x="38" y="77" class="label">Group A · n = 8</text><g transform="translate(42 92)"><circle class="person" cx="10" cy="10" r="8"/><circle class="person" cx="32" cy="10" r="8"/><circle class="person" cx="54" cy="10" r="8"/><circle class="person" cx="76" cy="10" r="8"/><circle class="person" cx="98" cy="10" r="8"/><circle class="person" cx="120" cy="10" r="8"/><circle class="person" cx="142" cy="10" r="8"/><circle class="person" cx="164" cy="10" r="8"/></g><text x="38" y="145" class="label">Group B · n = 4</text><g transform="translate(42 158)"><circle class="person" cx="10" cy="10" r="8"/><circle class="person" cx="32" cy="10" r="8"/><circle class="person" cx="54" cy="10" r="8"/><circle class="person" cx="76" cy="10" r="8"/></g><text x="38" y="210" class="label">Group C · n = 2</text><g transform="translate(42 222)"><circle class="person minor" cx="10" cy="10" r="8"/><circle class="person" cx="32" cy="10" r="8"/></g><text x="92" y="237" class="small">variant carrier</text><path class="arrow" d="M242 144h70m-10-9 10 9-10 9"/><rect class="panel" x="338" y="76" width="268" height="148" rx="12"/><text x="362" y="108" class="label">Combined reference panel</text><text x="362" y="140" class="small">Observed frequencies depend on</text><text x="362" y="162" class="small">sample size and representation.</text><text x="362" y="192" class="small">A short sequence cannot</text><text x="362" y="212" class="small">identify ancestry.</text><text x="32" y="268" class="small">Schematic example; group labels are abstract and do not represent named populations.</text></svg>
