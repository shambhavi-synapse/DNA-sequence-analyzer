<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-labelledby="title desc"><title id="title">UGA has different meanings in the standard and vertebrate mitochondrial genetic codes</title><desc id="desc">The RNA codon UGA is a stop signal in NCBI translation table one and encodes tryptophan in vertebrate mitochondrial translation table two. The comparison emphasizes that the sequence source determines the appropriate code.</desc><rect width="640" height="280" rx="16" fill="#f4f0e8"/><style>text{font-family:Manrope,Arial,sans-serif;fill:#2f3032}.title{font-size:20px;font-weight:700}.label{font-size:15px;font-weight:650}.codon{font-family:monospace;font-size:23px;font-weight:700}.small{font-size:13px;fill:#615a55}.card{fill:#fffaf5;stroke:#b9aaa0;stroke-width:1.5}.stop{fill:#b64735}.trp{fill:#e27556}.arrow{stroke:#6f6660;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><text x="32" y="38" class="title">The same codon can be interpreted differently</text><text x="48" y="112" class="label">RNA codon</text><text x="36" y="150" class="codon">5′ UGA 3′</text><path class="arrow" d="M205 133h28m-8-7 8 7-8 7"/><rect class="card" x="254" y="73" width="156" height="122" rx="12"/><text x="274" y="103" class="label">Table 1</text><text x="274" y="126" class="small">Standard code</text><rect class="stop" x="274" y="145" width="112" height="32" rx="7"/><text x="309" y="167" style="fill:#fff" class="label">STOP</text><rect class="card" x="430" y="73" width="178" height="122" rx="12"/><text x="450" y="103" class="label">Table 2</text><text x="450" y="126" class="small">Vertebrate</text><text x="450" y="143" class="small">mitochondrial code</text><rect class="trp" x="450" y="153" width="138" height="32" rx="7"/><text x="470" y="175" class="label">Trp · W</text><text x="32" y="230" class="small">UGA is one specific reassignment. Other code differences depend on the translation table.</text><text x="32" y="254" class="small">Choose a genetic code only when the biological source of the sequence supports it.</text></svg>
